- site: mailbox
  start: /mailbox/inbox
  task: 'Open the mail with the subject Invoice for October and reply saying: I will
    check and reply tomorrow'
  max_steps: 12
  expect:
  - path: send.subject
    startswith: 'Re:'
  - path: send.subject
    contains: Invoice for October
  - path: send.message
    contains: I will check and reply tomorrow
  id: gen-mail_reply-mailbox-00
  persona: 38
  secrets: {}
  v: large
