<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>PrivaSight</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; padding: 10px; font-size: 13px; }
      button { padding: 6px 12px; }
      img { width: 100%; border: 1px solid #ccc; margin-top: 8px; }
      #err { color: #b00; }
      #guard { color: #b00; font-weight: bold; }
      table { width: 100%; border-collapse: collapse; margin-top: 8px; }
      td, th { border-bottom: 1px solid #ddd; text-align: left; padding: 2px 4px; }
      fieldset { margin: 8px 0; border: 1px solid #ccc; }
      fieldset input { margin: 2px 6px 2px 0; }
      .step { border-top: 1px solid #ddd; padding: 4px 0; font-size: 12px; }
      .step img { max-width: 220px; margin: 0; }
      pre { background: #f4f4f4; padding: 6px; overflow: auto; max-height: 260px; font-size: 11px; }
    </style>
  </head>
  <body>
    <h3>PrivaSight</h3>
    <fieldset>
      <legend>Secrets (kept in memory on this device, never sent)</legend>
      <input id="secret-password" type="password" placeholder="PASSWORD" autocomplete="off" />
      <input id="secret-otp" type="password" placeholder="OTP" autocomplete="off" />
      <button id="save-secrets">Save</button> <button id="clear-secrets">Clear</button>
      <span id="vault-info"></span>
    </fieldset>
    <fieldset>
      <legend>Task</legend>
      <input id="task" style="width: 100%; box-sizing: border-box" placeholder="e.g. Log in with {PASSWORD} as user00" />
      <button id="start">Start</button> <button id="stop" disabled>Stop</button>
      <span id="status"></span>
      <div id="reply-box" style="display: none; margin-top: 6px">
        <input id="reply" style="width: 100%; box-sizing: border-box" placeholder="Your answer (it is checked for personal data before it is sent)" />
        <button id="send-reply">Answer</button>
      </div>
      <div id="log"></div>
    </fieldset>
    <details>
      <summary>Settings</summary>
      <fieldset>
        <legend>Agent</legend>
        <label>Server URL <input id="set-server" style="width: 100%; box-sizing: border-box" /></label>
        <label>Step limit <input id="set-steps" type="number" min="1" max="30" style="width: 70px" /></label>
        <label>Step timeout (s) <input id="set-timeout" type="number" min="5" max="600" style="width: 70px" /></label>
        <p style="margin: 6px 0 2px">Allowed origins (one per line). <code>http://localhost:8080</code> is always allowed; the agent never acts anywhere else.</p>
        <textarea id="set-origins" rows="3" style="width: 100%; box-sizing: border-box" placeholder="https://example.com"></textarea>
        <button id="save-settings">Save</button> <button id="reset-settings">Reset</button>
        <span id="settings-msg"></span>
      </fieldset>
    </details>
    <button id="capture">Capture &amp; mark</button>
    <label><input type="checkbox" id="privacy" checked /> Privacy view</label>
    <span id="info"></span>
    <p id="err"></p>
    <p id="guard"></p>
    <img id="shot" alt="Redacted screenshot (what would be sent)" />
    <div id="privacy-box">
      <h4>Regions painted over</h4>
      <table id="regions"></table>
      <h4>Outgoing JSON (exactly what would leave the device)</h4>
      <pre id="json"></pre>
    </div>
    <table id="els"></table>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
